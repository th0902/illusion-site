<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>錯視ギャラリー</title>
  <meta name="description" content="1ページに1つの錯視を表示する、純粋なCSSで描いた錯視コレクション。" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <header class="site">
    <h1>錯視ギャラリー</h1>
    <p>1ページに1つの錯視。カードを選んでご覧ください。</p>
  </header>

  <main class="wrap">
    <div class="grid" id="grid"></div>
  </main>

  <footer class="site">
    すべて純粋な HTML/CSS で描画 · GitHub Pages 対応
  </footer>

  <script src="assets/illusions.js"></script>
  <script>
    const grid = document.getElementById("grid");
    grid.innerHTML = window.ILLUSIONS.map((it) => `
      <a class="card" href="illusion.html?id=${it.id}">
        <div class="thumb">${it.art()}</div>
        <h3>${it.title}</h3>
        <p>${it.sub}</p>
      </a>`).join("");
  </script>
</body>
</html>
